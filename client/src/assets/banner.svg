<svg width="1000" height="1100" viewBox="0 0 1000 1100" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16224D"/>
      <stop offset="55%" stop-color="#1C2C5E"/>
      <stop offset="100%" stop-color="#111A3E"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243769"/>
      <stop offset="100%" stop-color="#2E4384"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2C3F76"/>
      <stop offset="100%" stop-color="#37508F"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#324A88"/>
      <stop offset="100%" stop-color="#4059A0"/>
    </linearGradient>

    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3D75"/>
      <stop offset="100%" stop-color="#1E2E5C"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E86D6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6E86D6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0B1230" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1000" height="1100" fill="url(#bg)"/>

  <!-- ambient glow behind the card, recentered for the taller/narrower canvas -->
  <circle cx="640" cy="560" r="380" fill="url(#glow)"/>

  <!-- bottom waves, layered -->
  <path d="M0 840 C 160 780, 300 900, 480 850 C 640 800, 780 900, 1000 820 L1000 1100 L0 1100 Z" fill="url(#waveA)" opacity="0.55"/>
  <path d="M0 900 C 190 850, 340 960, 540 910 C 700 870, 840 960, 1000 900 L1000 1100 L0 1100 Z" fill="url(#waveB)" opacity="0.7"/>
  <path d="M0 960 C 220 920, 400 1000, 580 960 C 740 926, 860 1000, 1000 960 L1000 1100 L0 1100 Z" fill="url(#waveC)"/>

  <!-- floating post card, centered within the narrower canvas -->
  <g filter="url(#softShadow)" transform="rotate(-6 690 550)">
    <rect x="530" y="345" width="320" height="390" rx="26" fill="url(#cardFace)" stroke="#43579A" stroke-width="1.5"/>

    <!-- avatar + name lines -->
    <circle cx="580" cy="401" r="20" fill="#7C90DB"/>
    <rect x="614" y="388" width="134" height="9" rx="4.5" fill="#8296DE"/>
    <rect x="614" y="406" width="90" height="7" rx="3.5" fill="#5B6EAE"/>

    <!-- body lines -->
    <rect x="560" y="442" width="260" height="7" rx="3.5" fill="#4C5F9C"/>
    <rect x="560" y="460" width="195" height="7" rx="3.5" fill="#4C5F9C"/>

    <!-- media block -->
    <rect x="560" y="492" width="260" height="132" rx="14" fill="#233461"/>
    <circle cx="775" cy="521" r="14" fill="#7C90DB"/>
    <path d="M576 613 L648 552 L698 596 L752 552 L810 613 Z" fill="#3A4E8C"/>

    <!-- action row -->
    <g stroke="#9AABE8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M568 668 h18 a9 9 0 0 1 9 9 v9 a9 9 0 0 1 -9 9 h-7 l-5 7 v-7 h-5 a9 9 0 0 1 -9 -9 v-9 a9 9 0 0 1 9 -9 z"/>
      <path d="M628 670 h14 a5.5 5.5 0 0 1 5.5 5.5 v9 M662 696 h-14 a5.5 5.5 0 0 1 -5.5 -5.5 v-9"/>
      <path d="M638 666 l3.5 3.5 -3.5 3.5 M652 700 l-3.5 -3.5 3.5 -3.5"/>
      <path d="M692 676 c-3.5 -7 -16 -5.5 -16 3.5 c0 8 16 18 16 18 s16 -10 16 -18 c0 -9 -12.5 -10.5 -16 -3.5 z"/>
      <circle cx="756" cy="672" r="4.5"/>
      <circle cx="756" cy="692" r="4.5"/>
      <circle cx="772" cy="682" r="4.5"/>
      <path d="M760 676 l7 -5.5 M760 688 l7 5.5"/>
    </g>
  </g>

  <!-- satellite bubble: like -->
  <g filter="url(#softShadow)">
    <rect x="625" y="278" width="72" height="65" rx="18" fill="#2E4180"/>
    <path d="M654 311 c-3 -5.5 -12 -3.5 -12 3 c0 6.5 12 13.5 12 13.5 s12 -7 12 -13.5 c0 -6.5 -9 -8.5 -12 -3 z"
          fill="#F3F6FF" transform="translate(7,0)"/>
  </g>

  <!-- satellite bubble: add-friend -->
  <g filter="url(#softShadow)">
    <rect x="452" y="480" width="68" height="68" rx="18" fill="#2E4180"/>
    <g stroke="#F3F6FF" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(470,495)">
      <circle cx="13" cy="11" r="7.2" fill="#F3F6FF" stroke="none"/>
      <path d="M2 36 c0 -11 9 -16 11 -16 s11 5.5 11 16"/>
      <path d="M31 13 h11 M36.5 7.5 v11"/>
    </g>
  </g>

  <!-- satellite bubble: share -->
  <g filter="url(#softShadow)">
    <rect x="855" y="480" width="68" height="68" rx="18" fill="#2E4180"/>
    <g stroke="#F3F6FF" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(873,495)">
      <circle cx="5.5" cy="18" r="5.5"/>
      <circle cx="27" cy="5.5" r="5.5"/>
      <circle cx="27" cy="30.5" r="5.5"/>
      <path d="M10 15.5 l12.5 -7 M10 20.5 l12.5 7"/>
    </g>
  </g>

  <!-- sparkle accents -->
  <g stroke="#8FA3E3" stroke-width="3.6" stroke-linecap="round" opacity="0.85">
    <line x1="835" y1="270" x2="831" y2="300"/>
    <line x1="862" y1="279" x2="847" y2="306"/>
    <line x1="820" y1="320" x2="853" y2="317"/>
  </g>
</svg>
